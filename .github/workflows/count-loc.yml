name: Count Lines of Code
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  count:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v3

      - name: Install cloc and jq
        run: sudo apt-get install -y cloc jq

      - name: Install Python dependencies
        run: pip install requests

      - name: Fetch all repos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: divakarvelagacherla
        run: |
          repos=$(curl -s "https://api.github.com/users/$GITHUB_USERNAME/repos?per_page=100" \
            -H "Authorization: token $GITHUB_TOKEN" \
            | jq -r '.[].name')
          echo "$repos" > repos.txt
          echo "total_repos=$(echo "$repos" | wc -w)" >> $GITHUB_ENV

      - name: Clone all repos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: divakarvelagacherla
        run: |
          mkdir all-repos
          cd all-repos
          while IFS= read -r repo; do
            git clone --depth=1 \
              "https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_USERNAME/$repo.git" \
              || echo "Skipping $repo"
          done < ../repos.txt

      - name: Count lines of code
        run: |
          cloc all-repos --json --out=cloc_raw.json
          echo "total_loc=$(jq '.SUM.code' cloc_raw.json)" >> $GITHUB_ENV

      - name: Count total PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: divakarvelagacherla
        run: |
          total_prs=$(curl -s "https://api.github.com/search/issues?q=type:pr+author:$GITHUB_USERNAME" \
            -H "Authorization: token $GITHUB_TOKEN" \
            | jq '.total_count')
          echo "total_prs=$total_prs" >> $GITHUB_ENV

      - name: Count total commits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: divakarvelagacherla
        run: |
          total_commits=0
          while IFS= read -r repo; do
            count=$(curl -s \
              "https://api.github.com/repos/$GITHUB_USERNAME/$repo/contributors" \
              -H "Authorization: token $GITHUB_TOKEN" \
              | jq --arg user "$GITHUB_USERNAME" \
              'if type == "array" then [.[] | select(.login | ascii_downcase == ($user | ascii_downcase)) | .contributions] | add // 0 else 0 end')
            total_commits=$((total_commits + ${count:-0}))
          done < repos.txt
          echo "total_commits=$total_commits" >> $GITHUB_ENV

      - name: Fetch LeetCode stats
        env:
          LEETCODE_USERNAME: divakarvelagacherla
        run: |
          python3 - <<'EOF'
          import requests
          import json
          import os

          username = os.environ['LEETCODE_USERNAME']
          url = f'https://leetcode-stats-api.herokuapp.com/{username}'

          try:
            stats = requests.get(url).json()
            solved = stats.get('totalSolved', 0)
            rank = stats.get('ranking', 0)
            easy = stats.get('easySolved', 0)
            medium = stats.get('mediumSolved', 0)
            hard = stats.get('hardSolved', 0)
          except Exception:
            solved = rank = easy = medium = hard = 0

          with open('leetcode_stats.json', 'w') as f:
            json.dump({
              'total_solved': solved,
              'ranking': rank,
              'easy_solved': easy,
              'medium_solved': medium,
              'hard_solved': hard
            }, f)
          EOF

      - name: Generate stats.json
        run: |
          leetcode=$(cat leetcode_stats.json)
          jq -n \
            --argjson loc "$total_loc" \
            --argjson repos "$total_repos" \
            --argjson prs "$total_prs" \
            --argjson commits "$total_commits" \
            --argjson leetcode "$leetcode" \
            '{
              total_lines_code: $loc,
              total_repos: $repos,
              total_prs: $prs,
              total_commits: $commits,
              leetcode: $leetcode
            }' \
            > stats.json

      - name: Commit and push stats.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add stats.json
          git commit -m "Update LOC stats" || echo "No changes"
          git pull --rebase origin main
          git push
